# CI smoke: launch the Simulator Dev/Release build and assert Home.
# Home must keep the visible title "MB Converter".
appId: com.marginallybetter.converter
---
- launchApp
- extendedWaitUntil:
    visible: "MB Converter"
    timeout: 30000
- assertVisible: "MB Converter"
- assertVisible: "Convert & Compress"
- assertVisible: "Photo Album"
- assertVisible: "Files"
- assertVisible: "From link"

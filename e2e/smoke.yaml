# CI smoke: launch the Simulator Dev/Release build and assert Home.
# Prefer testIDs — accessibility labels differ from visible titles.
appId: com.marginallybetter.converter
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible:
    id: "home-title"
- assertVisible: "Convert & Compress"
- assertVisible:
    id: "import-photos"
- assertVisible:
    id: "import-files"
- assertVisible:
    id: "import-link"

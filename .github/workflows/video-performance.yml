name: Video backend regressions

on:
  pull_request:
    paths:
      - 'Native/MBFFmpegBridge/**'
      - 'Native/FFmpeg/**'
      - 'Core/Conversion/**'
      - 'Scripts/BuildFFmpeg.py'
      - '.github/workflows/video-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    name: VP9 and video pipeline
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build tools and fixture encoders
        run: |
          brew install python@3.12 cmake pkg-config autoconf automake libtool ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Build pinned macOS codec libraries
        run: |
          python3 -m venv build/ffmpeg/tools
          build/ffmpeg/tools/bin/python -m pip install meson==1.7.2 ninja==1.11.1.3
          python3 Scripts/BuildFFmpeg.py --platform macos --libraries-only
      - name: Verify real VP9 encoding, color policy, and cancellation
        run: |
          python3 Native/MBFFmpegBridge/tests/run_tests.py
          python3 Native/MBFFmpegBridge/tests/test_video_pipeline.py
          python3 Scripts/TestFFmpegSwiftAdapter.py
          bash Scripts/TestFormatCapabilities.sh
          bash Scripts/TestAutoTargetPlanner.sh

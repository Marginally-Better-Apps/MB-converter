name: Validate conversions
on:
  pull_request:
  push:
    branches: ['feat/**', 'story/**']
concurrency:
  group: conversion-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  conversions:
    name: Offline conversion regressions
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Format, document, data, draft, image and CPU regressions
        run: bash ios-test.sh
  app:
    name: iPhone build and UI recovery
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build and UI tools
        run: |
          brew install python@3.12 cmake pkg-config autoconf automake libtool openjdk@17
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix openjdk@17)/bin" >> "$GITHUB_PATH"
          MAESTRO_VERSION=2.8.0 curl -fsSL https://get.maestro.mobile.dev -o /tmp/install-maestro.sh
          MAESTRO_VERSION=2.8.0 bash /tmp/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('Native/FFmpeg/sources.json', 'Scripts/BuildFFmpeg.py', 'Native/FFmpeg/patches/**') }}
      - name: Build native codecs
        run: |
          python3 -m venv build/ffmpeg/tools
          build/ffmpeg/tools/bin/python -m pip install meson==1.7.2 ninja==1.11.1.3
          python3 Scripts/BuildFFmpeg.py --platform ios --platform ios-simulator --jobs 4
          python3 Scripts/VerifyFFmpeg.py
      - name: Build for iPhone and test
        run: |
          xcodebuild -project Converter.xcodeproj -scheme Converter -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/DeviceDerivedData CODE_SIGNING_ALLOWED=NO build
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project Converter.xcodeproj -scheme Converter -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath build/DerivedData ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test
          xcrun simctl install "$device_id" build/DerivedData/Build/Products/Debug-iphonesimulator/Converter.app
          maestro test --device "$device_id" --test-output-dir build/ui-evidence e2e/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence
          path: build/ui-evidence
          if-no-files-found: ignore
